<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Formulário de funcionário do exemplo Spring Boot com Thymeleaf">
	<title th:text="${editando ? 'Editar funcionário' : 'Novo funcionário'} + ' | Projeto Web'">Novo funcionário | Projeto Web</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
	<nav class="navbar navbar-expand" data-bs-theme="dark" aria-label="Navegação principal">
		<div class="container py-2">
			<a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
				<span>Projeto Web</span>
			</a>
			<ul class="navbar-nav ms-auto">
				<li class="nav-item"><a class="nav-link active" th:href="@{/funcionario}">Funcionários</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/contas}">Contas do mês</a></li>
			</ul>
		</div>
	</nav>
</header>

<main class="container form-shell">
	<nav aria-label="Navegação estrutural" class="mb-4">
		<a class="back-link" th:href="@{/funcionario}">← Voltar para os funcionários</a>
	</nav>

	<div class="row g-4 align-items-start">
		<div class="col-lg-4">
			<p class="eyebrow mb-2">EDITOR</p>
			<h1 class="display-title form-title" th:text="${editando ? 'Editar funcionário' : 'Novo funcionário'}">Novo funcionário</h1>
			<p class="hero-copy mt-3">Preencha os campos ao lado.</p>
		</div>

		<div class="col-lg-8">
			<section class="content-card form-card" aria-label="Dados do funcionário">
				<form th:object="${funcionario}" th:action="@{/funcionario/save}" method="post" novalidate>
					<input type="hidden" name="editando" th:value="${editando}">

					<div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}">
						<strong>Revise os campos destacados.</strong>
						<ul class="mb-0 mt-2 ps-3">
							<li th:each="erro : ${#fields.detailedErrors()}" th:text="${erro.message}">Mensagem de erro</li>
						</ul>
					</div>

					<div class="row g-3">
						<div class="col-md-5">
							<label for="cpf" class="form-label">CPF</label>
							<input type="text" id="cpf" th:field="*{cpf}" class="form-control"
								   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'" th:readonly="${editando}"
								   placeholder="Somente números" maxlength="11" autofocus>
							<div class="invalid-feedback" th:errors="*{cpf}">Erro no CPF</div>
						</div>

						<div class="col-md-7">
							<label for="salario" class="form-label">Salário</label>
							<input type="number" id="salario" th:field="*{salario}" class="form-control"
								   th:classappend="${#fields.hasErrors('salario')} ? 'is-invalid'" step="0.01" min="0" placeholder="Ex.: 3500.00">
							<div class="invalid-feedback" th:errors="*{salario}">Erro no salário</div>
						</div>

						<div class="col-12">
							<label for="nome" class="form-label">Nome</label>
							<input type="text" id="nome" th:field="*{nome}" class="form-control"
								   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" placeholder="Ex.: Ana Souza" maxlength="100">
							<div class="invalid-feedback" th:errors="*{nome}">Erro no nome</div>
						</div>
					</div>

					<div class="form-actions">
						<a th:href="@{/funcionario}" class="btn btn-outline-secondary">Cancelar</a>
						<button type="submit" class="btn btn-primary px-4" th:text="${editando ? 'Salvar alterações' : 'Cadastrar funcionário'}">Cadastrar funcionário</button>
					</div>
				</form>
			</section>
		</div>
	</div>
</main>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
